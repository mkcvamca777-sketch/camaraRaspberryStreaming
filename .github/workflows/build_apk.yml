name: Compilar APK Robot Control

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerar Plataforma Android y Gradle Wrapper
        run: |
          cd mobile_app
          flutter create --platforms=android --org com.telepresence .

      - name: Inyectar Permisos en AndroidManifest
        run: |
          python3 -c "
          manifest_path = 'mobile_app/android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
          '''
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', perms + '\n    <application')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          "

      - name: Configurar minSdk 21 y Signing Config Debug
        run: |
          python3 -c "
          import os, re
          gradle_path = 'mobile_app/android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  txt = f.read()
              txt = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', txt)
              txt = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', txt)
              # Asegurar que release firme con debug keys para permitir instalacion directa
              if 'signingConfigs.debug' not in txt:
                  txt = txt.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }')
              with open(gradle_path, 'w') as f:
                  f.write(txt)
          "

      - name: Obtener Dependencias y Analizar
        run: |
          cd mobile_app
          flutter pub get
          flutter analyze || true

      - name: Compilar APK (Debug y Release)
        run: |
          cd mobile_app
          flutter build apk --debug
          flutter build apk --release --no-tree-shake-icons || true

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: RobotControl-APK
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
