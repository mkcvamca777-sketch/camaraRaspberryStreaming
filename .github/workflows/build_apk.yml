name: Compilar APK Robot Control

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerar Plataforma Android
        run: |
          cd mobile_app
          flutter create --platforms=android --org com.telepresence .

      - name: Inyectar Permisos en AndroidManifest
        run: |
          python3 -c "
          manifest_path = 'mobile_app/android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
          '''
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', perms + '\n    <application')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          "

      - name: Configurar minSdk 21 en Gradle
        run: |
          python3 -c "
          import os, re
          for fname in ['mobile_app/android/app/build.gradle', 'mobile_app/android/app/build.gradle.kts']:
              if os.path.exists(fname):
                  with open(fname, 'r') as f:
                      txt = f.read()
                  txt = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', txt)
                  txt = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', txt)
                  with open(fname, 'w') as f:
                      f.write(txt)
          "

      - name: Obtener Dependencias
        run: |
          cd mobile_app
          flutter pub get

      - name: Compilar APK
        run: |
          cd mobile_app
          flutter build apk --debug --verbose > build.log 2>&1 || {
            tail -n 120 build.log
            exit 1
          }

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: RobotControl-APK
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
